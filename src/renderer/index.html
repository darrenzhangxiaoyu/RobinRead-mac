<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src * data: robin-icon:; media-src * data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *" />
  <title>RobinRead</title>
  <link rel="stylesheet" href="styles/robin.css" />
  <link rel="stylesheet" href="styles/store.css" />
  <link rel="stylesheet" href="styles/account.css" />
  <!-- highlight.js（本地 vendor，UMD → window.hljs）：同步 script 先于 module(app.js) 执行。
       CSP script-src 'self' 允许本地 vendor。KaTeX 不静态引入——reader 检测到公式才动态注入（普通文章零开销）。 -->
  <script src="vendor/highlight/highlight.min.js"></script>
</head>
<body>
  <!-- U19：窗口拖拽 / snap 提示层（拖动标题栏时经 body.nj-win-drag 显现，纯视觉，aria 对辅助技术隐藏） -->
  <div class="nj-snap-hint" aria-hidden="true">
    <i class="nj-snap-edge nj-snap-top"></i>
    <i class="nj-snap-edge nj-snap-bottom"></i>
    <i class="nj-snap-edge nj-snap-left"></i>
    <i class="nj-snap-edge nj-snap-right"></i>
  </div>
  <div id="app">
    <!-- 统一工具栏：三区跟随分割线（对应 NSToolbar + TrackingSeparator）；整条可拖拽，双击空白处最大化/还原（title 由 app.js 按 i18n 覆写）。U19：语义抛光 role=banner + aria-label -->
    <div id="main-toolbar" title="双击标题栏空白处可最大化或还原窗口" role="banner" aria-label="RobinRead 工具栏">
      <div class="tb-zone tb-zone-sidebar">
        <button class="btn icon-only" id="btn-toggle-sidebar" title="切换侧栏"></button>
        <button class="btn icon-only" id="btn-refresh" title="刷新所有订阅"></button>
        <button class="btn icon-only" id="btn-add" title="添加订阅或新建文件夹"></button>
      </div>
      <div class="tb-zone tb-zone-list" id="tb-zone-list">
        <div class="tb-title" id="tb-list-title"></div>
        <div class="tb-spring"></div>
        <button class="btn icon-only" id="btn-mark-all" title="将当前列表全部标为已读"></button>
      </div>
      <div class="tb-zone tb-zone-reader">
        <div class="tb-spring"></div>
        <div class="reader-capsule" id="reader-capsule">
          <button class="cap-btn" id="cap-translate" title="开启逐段翻译 (C)"></button>
          <button class="cap-btn" id="cap-deepread" title="一键精读：论证/概念/证据/金句 (D)"></button>
          <button class="cap-btn" id="cap-rsummary" title="高质量中文摘要 (S)"></button>
          <button class="cap-btn" id="cap-read" title="标为已读"></button>
          <button class="cap-btn" id="cap-star" title="收藏 (M)"></button>
          <button class="cap-btn" id="cap-highlight" title="高亮：选中文字快速高亮（H）；无选区打开批注面板"></button>
          <button class="cap-btn" id="cap-note" title="批注面板：本篇高亮与笔记"></button>
          <button class="cap-btn" id="cap-review" title="加入复习"></button>
          <button class="cap-btn" id="cap-popout" title="在独立窗口打开"></button>
          <button class="cap-btn" id="cap-browser" title="打开原网页"></button>
          <button class="cap-btn" id="cap-autoscroll" title="自动滚动阅读"></button>
          <button class="cap-btn" id="cap-zen" title="禅模式全屏阅读"></button>
          <button class="cap-btn" id="cap-focus-session" title="专注会话：设定时长开始沉浸阅读"></button>
          <button class="cap-btn" id="cap-focus" title="聚焦模式：非当前段落渐暗（F）"></button>
        </div>
        <div class="tb-spring"></div>
        <div class="window-controls" id="window-controls">
          <button class="wc-btn" id="wc-min" title="最小化"></button>
          <button class="wc-btn" id="wc-max" title="最大化"></button>
          <button class="wc-btn wc-close" id="wc-close" title="关闭"></button>
        </div>
      </div>
    </div>
    <div id="split">
      <aside class="column column-sidebar robin-surface" id="sidebar" tabindex="0">
        <div class="sidebar-scroll" id="sidebar-scroll">
          <!-- R72-① 冷启动静态骨架：JS 接管前撑住首帧（与 U11 骨架行同几何 → 真实首帧零跳变）；
               bootstrap 首次真实渲染（或明确失败）后由 app.js dismissBootSkeleton 摘除 -->
          <div class="nj-boot-skeleton" id="nj-boot-skeleton-sidebar" aria-hidden="true">
            <div class="nj-skeleton-list">
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w100"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w45"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w100"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w70"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w45"></i><i class="nj-sk nj-sk-line w100"></i></span></div>
            </div>
          </div>
        </div>
        <div class="sidebar-footer" id="sidebar-footer"></div>
      </aside>
      <div class="splitter" id="splitter-sidebar"></div>
      <section class="column column-list robin-surface" id="list" tabindex="0">
        <div class="list-scroll" id="list-scroll">
          <div class="nj-boot-skeleton" id="nj-boot-skeleton" aria-hidden="true">
            <div class="nj-skeleton-list">
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w45"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w45"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w45"></i><i class="nj-sk nj-sk-line w100"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w45"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w45"></i><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w100"></i></span></div>
              <div class="nj-sk-row"><span class="nj-sk nj-sk-dot"></span><span class="nj-sk-lines"><i class="nj-sk nj-sk-line w70"></i><i class="nj-sk nj-sk-line w100"></i><i class="nj-sk nj-sk-line w45"></i></span></div>
            </div>
          </div>
        </div>
      </section>
      <div class="splitter" id="splitter-list"></div>
      <section class="column column-reader robin-surface" id="reader" tabindex="0">
        <div class="reading-progress" id="reading-progress"><div class="reading-progress-fill"></div></div>
        <div class="reader-scroll" id="reader-scroll"></div>
        <div class="toc-rail" id="toc-rail">
          <div class="toc-track" id="toc-track"></div>
          <div class="toc-peak" id="toc-peak"></div>
        </div>
        <div class="floating-scrollbar" id="floating-scrollbar"><div class="thumb" id="floating-thumb"></div></div>
      </section>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
