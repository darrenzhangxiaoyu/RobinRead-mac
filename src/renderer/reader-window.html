<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src * data: robin-icon:; media-src * data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src *" />
  <title>RobinRead</title>
  <link rel="stylesheet" href="styles/robin.css" />
  <script src="vendor/highlight/highlight.min.js"></script>
</head>
<body>
  <div id="app" class="rw-app">
    <!-- 迷你工具栏（F17）：字号 / 主题跟随（自动，指示灯）/ 关闭 -->
    <div class="rw-toolbar">
      <div class="tb-title rw-title" id="rw-title"></div>
      <div class="tb-spring"></div>
      <button class="btn icon-only" id="rw-font-minus" title="缩小正文字号"></button>
      <button class="btn icon-only" id="rw-font-plus" title="放大正文字号"></button>
      <span class="rw-theme-dot" id="rw-theme-dot" title="主题跟随应用设置"></span>
      <button class="btn icon-only" id="rw-close" title="关闭窗口"></button>
    </div>
    <section class="column column-reader robin-surface rw-reader" id="reader" tabindex="0">
      <div class="reading-progress" id="reading-progress"><div class="reading-progress-fill"></div></div>
      <div class="reader-scroll" id="reader-scroll"></div>
      <div class="toc-rail" id="toc-rail">
        <div class="toc-track" id="toc-track"></div>
        <div class="toc-peak" id="toc-peak"></div>
      </div>
      <div class="floating-scrollbar" id="floating-scrollbar"><div class="thumb" id="floating-thumb"></div></div>
    </section>
  </div>
  <script type="module" src="reader-window.js"></script>
</body>
</html>
